{% extends "base.html" %}

{% block title %}Add Research Source · {{ session.title }}{% endblock %}

{% block content %}

<div class="research-form-page">

    <div class="research-header">
        <div>
            <div class="research-header-icon">
                <i class="bi bi-diagram-3"></i>
            </div>

            <h1>Add Research Source</h1>

            <p class="research-intro">
                Choose where Workbeam should gather evidence for
                <strong>{{ session.title }}</strong>.
            </p>
        </div>
    </div>

    <div class="research-form-card">
        

        <form method="post">
            {% csrf_token %}
            {% if error %}
                <div class="alert alert-warning" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <div class="mb-4">
                <label class="form-label">Source type</label>

                <div class="research-source-options">

                    <label class="research-source-option">
                        <input
                            type="radio"
                            name="source_type"
                            value="web"
                            required
                        >

                        <span class="research-source-option-icon">
                            <i class="bi bi-globe2"></i>
                        </span>

                        <span>
                            <strong>Web</strong>
                            <small>Websites, articles and online discussions</small>
                        </span>
                    </label>

                    <label class="research-source-option">
                        <input
                            type="radio"
                            name="source_type"
                            value="instagram"
                        >

                        <span class="research-source-option-icon">
                            <i class="bi bi-instagram"></i>
                        </span>

                        <span>
                            <strong>Instagram</strong>
                            <small>Posts, creators and conversations</small>
                        </span>
                    </label>

                    <label class="research-source-option">
                        <input
                            type="radio"
                            name="source_type"
                            value="tiktok"
                        >

                        <span class="research-source-option-icon">
                            <i class="bi bi-tiktok"></i>
                        </span>

                        <span>
                            <strong>TikTok</strong>
                            <small>Videos, creators and trends</small>
                        </span>
                    </label>

                    <label class="research-source-option">
                        <input
                            type="radio"
                            name="source_type"
                            value="linkedin"
                        >

                        <span class="research-source-option-icon">
                            <i class="bi bi-linkedin"></i>
                        </span>

                        <span>
                            <strong>LinkedIn</strong>
                            <small>Professional discussions and industry activity</small>
                        </span>
                    </label>

                </div>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label">
                    Source name
                </label>

                <input
                    type="text"
                    name="name"
                    id="name"
                    class="form-control"
                    placeholder="e.g. Nigerian Architecture Market"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="url" class="form-label">
                    URL
                    <span class="text-muted">(optional for now)</span>
                </label>

                <input
                    type="url"
                    name="url"
                    id="url"
                    class="form-control"
                    placeholder="https://example.com"
                >
            </div>

            <div class="d-flex gap-2">
                <a
                    href="{% url 'research:detail' session.pk %}"
                    class="btn btn-light"
                >
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-lg me-1"></i>
                    Add Source
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
